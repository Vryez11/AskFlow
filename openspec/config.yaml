schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# PRD와 OpenSpec을 기능 ID로 잇는 규칙(conventions/spec.md)과
# 테스트 먼저, 검사 통과 후 완료하는 하네스 규칙(conventions/harness.md)
rules:
  proposal:
    - '이 change가 맡는 PRD 기능 ID(예: F-003)를 맨 앞에 적는다. 기능 ID는 docs/mvp/04-prd.md를 따른다'
    - 'PRD에 없는 기능이면 change를 만들기 전에 PRD부터 고쳐야 한다고 알린다'
  specs:
    - '요구사항 제목 끝에 관련 기능 ID를 괄호로 붙인다. 예) "### Requirement: 읽기 전용 실행 (F-003)"'
    - '목표, 성공 지표, 우선순위는 쓰지 않고 PRD를 가리킨다'
  design:
    - '테스트를 어디에 어떤 방식으로 둘지, 평가 세트 정답률에 영향이 있는지 적는다'
  tasks:
    - '첫 작업 묶음은 specs의 시나리오(WHEN/THEN)를 실패하는 테스트로 옮기는 일이다'
    - '작업마다 완료를 확인하는 방법(테스트 이름이나 명령)을 적는다'
    - '작업 하나는 새 세션 한 번에 끝낼 크기로 나눈다. Ralph 루프가 반복마다 작업 하나씩 처리한다'
    - '마지막 작업 묶음은 conventions/harness.md의 검토와 change 완료 조건 확인이다'

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - 'conventions/harness.md의 흐름을 따른다. 테스트를 먼저 만들고, 자동 검사가 모두 통과해야 작업을 끝낸다'
      - '진행 메모는 change 폴더의 progress.md에 덧붙인다. 바깥 루프는 scripts/ralph/ralph.sh로 돌린다'
  archive:
    guidance:
      - 'conventions/harness.md의 change 완료 조건을 모두 확인한 뒤 archive한다'
